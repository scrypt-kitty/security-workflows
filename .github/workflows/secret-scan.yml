name: Secret scan (gitleaks)

# Reusable workflow. GitHub's own secret scanning only runs for free on
# public repos; gitleaks is the free equivalent for private ones.
#
# Call it from another repo:
#
#   jobs:
#     secrets:
#       uses: scrypt-kitty/security-workflows/.github/workflows/secret-scan.yml@main

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: Fail the job if gitleaks finds anything.
        type: boolean
        default: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets it comment findings on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits, not just the current tree

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by the action; auto-provided per run, not a repo secret to set up
          GITLEAKS_ENABLE_SUMMARY: "true"
          # No GITLEAKS_LICENSE set: required for orgs' gitleaks-cloud features
          # only, not for the free open-source scan this workflow runs.
        continue-on-error: ${{ !inputs.fail-on-findings }}
