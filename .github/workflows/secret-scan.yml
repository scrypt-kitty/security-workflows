name: Secret scan (gitleaks)

# Reusable workflow. GitHub's own secret scanning only runs for free on
# public repos; gitleaks is the free equivalent for private ones.
#
# Call it from another repo:
#
#   jobs:
#     secrets:
#       uses: scrypt-kitty/security-workflows/.github/workflows/secret-scan.yml@main

on:
  workflow_call:
    inputs:
      fail-on-findings:
        description: Fail the job if gitleaks finds anything.
        type: boolean
        default: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits, not just the current tree

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
          # No GITLEAKS_LICENSE set: this runs the free, open-source scan only
          # (no gitleaks-cloud features), which is all this workflow needs.
        continue-on-error: ${{ !inputs.fail-on-findings }}
